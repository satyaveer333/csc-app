<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Badge with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#dsGradient)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Digital Accent Dots / Circuit spark -->
  <circle cx="14" cy="14" r="2.5" fill="#38bdf8" />
  <circle cx="21" cy="14" r="1.5" fill="#93c5fd" opacity="0.8" />
  <circle cx="14" cy="21" r="1.5" fill="#93c5fd" opacity="0.8" />

  <!-- Monogram DS Typography -->
  <g filter="url(#glow)">
    <!-- Letter 'D' -->
    <path d="M 18 22 L 29 22 C 36 22 40 26 40 32 C 40 38 36 42 29 42 L 18 42 Z M 24 27 L 24 37 L 28.5 37 C 32 37 34.5 35 34.5 32 C 34.5 29 32 27 28.5 27 Z" 
          fill="url(#textGrad)" />

    <!-- Letter 'S' overlapping with modern offset -->
    <path d="M 44.5 26.5 C 43 23.5 39.5 22 36 22 C 34.5 22 33 22.3 32 23 L 34.5 27 C 35 26.8 35.8 26.5 36.5 26.5 C 38 26.5 39 27.2 39 28.2 C 39 29.2 38 29.8 36.5 30.3 L 34 31.2 C 31 32.3 29.5 34.5 29.5 37.5 C 29.5 41.5 33 44 38 44 C 41.5 44 44.5 42.5 46 39.5 L 41.5 37 C 40.8 38.2 39.5 39 38 39 C 36.5 39 35.5 38.3 35.5 37.3 C 35.5 36.3 36.5 35.8 38 35.2 L 40.5 34.2 C 43.5 33 45 30.5 45 27.8 C 45 27.3 44.8 26.9 44.5 26.5 Z" 
          fill="#38bdf8" />
  </g>

  <!-- Small Bottom Tech Accent Bar -->
  <rect x="22" y="49" width="20" height="2.5" rx="1.25" fill="#38bdf8" opacity="0.9" />
</svg>
